services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wasap_test
      POSTGRES_USER: wasap_test
      POSTGRES_PASSWORD: wasap_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wasap_test -d wasap_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
